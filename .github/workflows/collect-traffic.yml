name: Record traffic history

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: traffic-history
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'wenbo-wei/wenbo-wei.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record a read-only snapshot on the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/contents/traffic.json?ref=site-traffic" > "${RUNNER_TEMP}/traffic-meta.json"
          python3 scripts/collect_traffic.py --metadata "${RUNNER_TEMP}/traffic-meta.json" --payload "${RUNNER_TEMP}/traffic-update.json"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/traffic.json" --input "${RUNNER_TEMP}/traffic-update.json" --silent
